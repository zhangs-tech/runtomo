spring.application.name=runtomo.server
spring.config.import=optional:file:.env[.properties],optional:configtree:/run/secrets/,classpath:game/species.yaml,classpath:game/tunables.yaml,classpath:game/quests.yaml,classpath:game/banners.yaml,classpath:game/foods.yaml
spring.flyway.locations=classpath:db/migration
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
runtomo.google.web-client-id=${GOOGLE_WEB_CLIENT_ID}
spring.mvc.problemdetails.enabled=true
jwt.public.key=${JWT_PUBLIC_KEY}
jwt.private.key=${JWT_PRIVATE_KEY}